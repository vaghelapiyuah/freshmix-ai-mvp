name: Keep backend awake

# Render's free tier sleeps after ~15 min idle (first request then takes ~40s).
# Ping the health endpoint every 10 min so the API stays warm for visitors.
on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (GitHub min is 5)
  workflow_dispatch: {}         # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FreshMix API health
        run: |
          echo "Pinging backend at $(date -u)"
          curl -fsS --max-time 60 https://freshmix-api-nvea.onrender.com/v1/health || true
